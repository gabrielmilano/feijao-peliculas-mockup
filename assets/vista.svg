<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" preserveAspectRatio="xMidYMid slice">
  <!-- Vista ilustrativa (fictícia) para o simulador: céu, prédios genéricos, árvores e rua. Sem marcas nem fachadas reais. -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc3ec"/>
      <stop offset=".6" stop-color="#cfe5f6"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <radialGradient id="sol" cx=".78" cy=".2" r=".35">
      <stop offset="0" stop-color="#fff9e6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff9e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asfalto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7178"/>
      <stop offset="1" stop-color="#3d4248"/>
    </linearGradient>
    <pattern id="janelas" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="10" height="12" fill="#dcebf7" opacity=".55"/>
    </pattern>
    <pattern id="janelas2" width="22" height="18" patternUnits="userSpaceOnUse">
      <rect x="5" y="4" width="12" height="9" fill="#f3f7fa" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="720" height="405" fill="url(#ceu)"/>
  <rect width="720" height="405" fill="url(#sol)"/>
  <!-- nuvens -->
  <g fill="#fff" opacity=".8">
    <ellipse cx="140" cy="70" rx="70" ry="16"/><ellipse cx="185" cy="60" rx="45" ry="14"/>
    <ellipse cx="460" cy="48" rx="60" ry="12"/><ellipse cx="500" cy="40" rx="34" ry="10"/>
  </g>
  <!-- prédios ao fundo -->
  <g fill="#9fb0c0">
    <rect x="0" y="150" width="70" height="170"/><rect x="62" y="120" width="54" height="200"/>
    <rect x="300" y="140" width="64" height="180"/><rect x="560" y="130" width="80" height="190"/><rect x="636" y="165" width="84" height="155"/>
  </g>
  <!-- prédios da frente -->
  <g>
    <rect x="110" y="95" width="96" height="225" fill="#7d8d9c"/><rect x="110" y="95" width="96" height="225" fill="url(#janelas)"/>
    <rect x="200" y="160" width="110" height="160" fill="#b9a99a"/><rect x="200" y="160" width="110" height="160" fill="url(#janelas2)"/>
    <rect x="360" y="110" width="88" height="210" fill="#6f8091"/><rect x="360" y="110" width="88" height="210" fill="url(#janelas)"/>
    <rect x="445" y="175" width="120" height="145" fill="#c9bfb3"/><rect x="445" y="175" width="120" height="145" fill="url(#janelas2)"/>
  </g>
  <!-- calçada e árvores -->
  <rect x="0" y="312" width="720" height="18" fill="#c8ccd0"/>
  <g fill="#4f7d4a">
    <circle cx="90" cy="268" r="34"/><circle cx="118" cy="282" r="26"/>
    <circle cx="335" cy="272" r="30"/><circle cx="600" cy="262" r="38"/><circle cx="632" cy="282" r="24"/>
  </g>
  <g fill="#5b4a3c"><rect x="96" y="290" width="7" height="26"/><rect x="333" y="292" width="6" height="24"/><rect x="604" y="290" width="8" height="26"/></g>
  <!-- poste -->
  <rect x="520" y="200" width="5" height="116" fill="#4a5056"/><rect x="500" y="198" width="30" height="5" rx="2" fill="#4a5056"/>
  <!-- rua -->
  <rect x="0" y="330" width="720" height="75" fill="url(#asfalto)"/>
  <g fill="#e9eef2" opacity=".85"><rect x="40" y="365" width="70" height="5"/><rect x="200" y="365" width="70" height="5"/><rect x="360" y="365" width="70" height="5"/><rect x="520" y="365" width="70" height="5"/><rect x="680" y="365" width="40" height="5"/></g>
</svg>
